[workspace]
members = ["virse-api"]
resolver = "3"

[workspace.package]
authors = ["uchouT <uchout@virse.ai>"]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "io-util", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[package]
name = "virse-cli"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1

[dependencies]
base64 = "0.22"
getrandom = "0.3"
url = "2"
semver = "1"
virse-api = { version = "0.1.0", path = "virse-api" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
uuid.workspace = true
clap = { version = "4", features = ["derive"] }
directories = "6"
rpassword = "7"
sha2 = "0.10"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
yaml_serde = "0.10"
rustix = { version = "1", features = ["fs"] }

[[bin]]
name = "virse"
path = "src/main.rs"

[dev-dependencies]
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
